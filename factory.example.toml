[factory]
data_dir = 'data'
poll_seconds = 2
job_timeout_seconds = 14400
service_retry_seconds = 30
service_attempts = 120
# Set an absolute ffprobe.exe path if FFmpeg is not on PATH.
ffprobe = 'ffprobe'

[mpt]
root = 'D:\Apps\MoneyPrinterTurbo-Portable-Windows-1.3.6\MoneyPrinterTurbo'
python = 'D:\Apps\MoneyPrinterTurbo-Portable-Windows-1.3.6\lib\python\python.exe'
branch = 'moneyprinter_qwen21_quality_v3_1'
worktrees_dir = 'D:\Apps\MPT-worktrees'

[[services]]
name = 'llama'
url = 'http://127.0.0.1:8080/health'
json_key = 'status'
required = true
auto_start = false
# Optional: supply your actual argv and cwd. Never put credentials here.
command = []
# token_env = 'LLAMA_API_KEY'

[[services]]
name = 'bridge'
# Audited bridge has only /v1/images/*, no /health or /v1/models.
# Root 404 verifies HTTP liveness only. Generation verifies the workflow.
url = 'http://127.0.0.1:8090/'
expected_status = [404]
readiness = 'liveness_only'
required = true
auto_start = false
command = []

[[services]]
name = 'comfyui'
url = 'http://127.0.0.1:8188/system_stats'
json_key = 'system'
required = true
auto_start = false
command = []
# Preserve --disable-async-offload --disable-pinned-memory in your launcher.

[[services]]
name = 'webui'
url = 'http://127.0.0.1:8501/_stcore/health'
required = false
auto_start = false
command = ['D:\Apps\MoneyPrinterTurbo-Portable-Windows-1.3.6\lib\python\python.exe', '-m', 'streamlit', 'run', 'webui/Main.py', '--server.port', '8501', '--server.address', '127.0.0.1']
cwd = 'D:\Apps\MoneyPrinterTurbo-Portable-Windows-1.3.6\MoneyPrinterTurbo'
